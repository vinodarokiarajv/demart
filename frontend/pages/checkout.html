<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - DeMart</title>

    <link rel="icon" type="image/png" href="../assets/icons/demart-icon.png">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

        <header class="site-header">

        <a href="home.html" class="brand-link" data-testid="site-brand">
            <span class="brand">DeMart</span>
        </a>

        <nav class="main-nav">

            <a href="home.html" data-testid="home-link">Home</a>
            <a href="products.html" data-testid="products-link">Products</a>
            <a href="login.html" id="login-link" data-testid="login-link">Login</a>
            <a href="register.html" id="register-link" data-testid="register-link">Register</a>
            <a href="account.html" id="account-link" data-testid="account-link">Account</a>
            <a href="orders.html" id="orders-link" data-testid="orders-link">My Orders</a>
            <a href="cart.html" data-testid="cart-link">
                Cart (<span id="cart-count" data-testid="cart-count">0</span>)
            </a>
            <a href="admin-users.html" id="admin-users-link" data-testid="admin-users-link">Manage Users</a>
            <a href="admin-orders.html" id="admin-orders-link" data-testid="admin-orders-link">Manage Orders</a>
            <a href="#" id="logout-link" data-testid="logout-link">Logout</a>

        </nav>

    </header>


    <main>

        <section class="checkout-page">

            <h2>Checkout</h2>

            <div class="checkout-container">

                <div class="checkout-form">

                    <div class="checkout-section">

                        <h3>Contact Information</h3>

                        <div class="form-group">

                            <label for="email">
                                Email Address
                            </label>

                            <input
                                id="email"
                                type="email"
                                placeholder="you@example.com"
                                data-testid="checkout-email"
                            >

                        </div>

                    </div>


                    <div class="checkout-section">

                        <h3>Shipping Address</h3>

                        <div class="form-row">

                            <div class="form-group">

                                <label for="first-name">
                                    First Name
                                </label>

                                <input
                                    id="first-name"
                                    type="text"
                                    placeholder="First name"
                                    data-testid="checkout-first-name"
                                >

                            </div>

                            <div class="form-group">

                                <label for="last-name">
                                    Last Name
                                </label>

                                <input
                                    id="last-name"
                                    type="text"
                                    placeholder="Last name"
                                    data-testid="checkout-last-name"
                                >

                            </div>

                        </div>


                        <div class="form-group">

                            <label for="street">
                                Street Address
                            </label>

                            <input
                                id="street"
                                type="text"
                                placeholder="Street and house number"
                                data-testid="checkout-street"
                            >

                        </div>


                        <div class="form-row">

                            <div class="form-group">

                                <label for="postal-code">
                                    Postal Code
                                </label>

                                <input
                                    id="postal-code"
                                    type="text"
                                    placeholder="Postal code"
                                    data-testid="checkout-postal-code"
                                >

                            </div>

                            <div class="form-group">

                                <label for="city">
                                    City
                                </label>

                                <input
                                    id="city"
                                    type="text"
                                    placeholder="City"
                                    data-testid="checkout-city"
                                >

                            </div>

                        </div>


                        <div class="form-group checkout-country-group">

                            <label for="country">
                                Country
                            </label>

                            <input
                                id="country"
                                type="text"
                                placeholder="Enter your country"
                                autocomplete="country-name"
                                required
                                data-testid="checkout-country"
                            >

                        </div>

                    </div>


                    <div class="checkout-section">

                        <h3>Delivery Method</h3>

                        <div class="delivery-option">

                            <input
                                id="standard-delivery"
                                type="radio"
                                name="delivery"
                                value="standard"
                                checked
                                data-testid="standard-delivery"
                            >

                            <label for="standard-delivery">

                                <strong>Standard Delivery</strong>

                                <span>
                                    3–5 business days — €4.99
                                </span>

                            </label>

                        </div>


                        <div class="delivery-option">

                            <input
                                id="express-delivery"
                                type="radio"
                                name="delivery"
                                value="express"
                                data-testid="express-delivery"
                            >

                            <label for="express-delivery">

                                <strong>Express Delivery</strong>

                                <span>
                                    1–2 business days — €9.99
                                </span>

                            </label>

                        </div>

                    </div>


                    <div class="checkout-section">

                        <h3>Payment Method</h3>

                        <div class="payment-option">

                            <input
                                id="card-payment"
                                type="radio"
                                name="payment"
                                value="card"
                                checked
                                data-testid="card-payment"
                            >

                            <label for="card-payment">
                                Credit / Debit Card
                            </label>

                        </div>


                        <div class="payment-option">

                            <input
                                id="paypal-payment"
                                type="radio"
                                name="payment"
                                value="paypal"
                                disabled
                                data-testid="paypal-payment"
                            >

                            <label for="paypal-payment">
                                PayPal
                                <span> — Coming soon</span>
                            </label>

                        </div>

                    </div>


                    <button
                        type="button"
                        id="place-order-button"
                        class="place-order-button"
                        data-testid="place-order"
                    >
                        Place Order
                    </button>

                </div>


                <aside class="checkout-summary">

    <h3>Order Summary</h3>

    <div id="checkout-products" data-testid="checkout-products">
        <!-- Cart products will be loaded dynamically -->
    </div>

    <div class="summary-row">

        <span>Subtotal</span>
        <span id="checkout-subtotal" data-testid="checkout-subtotal">€0.00</span>

    </div>


    <div class="summary-row">

        <span>Shipping</span>
        <span id="checkout-shipping" data-testid="checkout-shipping">€0.00</span>

    </div>


    <div class="summary-row checkout-total">

        <strong>Total</strong>
        <strong id="checkout-total" data-testid="checkout-total">€0.00</strong>

    </div>

</aside>

            </div>

        </section>

    </main>


    <footer>

        <p>&copy; 2026 DeMart. All rights reserved.</p>

    </footer>


    <script src="../js/app.js"></script>

</body>

</html>
