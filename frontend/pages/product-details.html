<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - DeMart</title>

    <link rel="icon" type="image/png" href="../assets/icons/demart-icon.png">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

        <header class="site-header">

        <a href="home.html" class="brand-link">
            <span class="brand">DeMart</span>
        </a>

        <nav class="main-nav">

            <a href="home.html">Home</a>

            <a href="products.html">Products</a>

            <a href="login.html" id="login-link">Login</a>

            <a href="register.html" id="register-link">Register</a>

            <a href="account.html" id="account-link">Account</a>

            <a href="orders.html" id="orders-link">My Orders</a>

            <a href="cart.html" data-testid="cart-link">
                Cart (<span id="cart-count" data-testid="cart-count">0</span>)
            </a>

            <a href="admin-users.html" id="admin-users-link">Manage Users</a>

            <a href="admin-orders.html" id="admin-orders-link">Manage Orders</a>

            <a href="#" id="logout-link">Logout</a>

        </nav>

    </header>


    <main>
    <div
        id="product-error"
        class="product-error"
        data-testid="product-error"
        hidden
    >
        <h2>Product Not Found</h2>
        <p>
            The product you're looking for doesn't exist or is no longer available.
        </p>
        <a href="products.html">Back to Products</a>
    </div>
    <section class="product-details">
        <div class="product-details-image">
            <img
                id="product-image"
                src=""
                alt=""
                data-testid="product-image"
            >
        </div>

        <div class="product-details-info">
            <p id="product-category" class="product-category" data-testid="product-category"></p>

            <h2 id="product-name" data-testid="product-name"></h2>

            <p id="product-rating" class="product-rating" data-testid="product-rating"></p>

            <p id="product-price" class="product-price" data-testid="product-price"></p>
            <p id="product-stock" class="product-stock" data-testid="product-stock"></p>
            <p id="product-description" class="product-description" data-testid="product-description"></p>

            <div class="product-quantity">
                <label for="quantity">Quantity</label>
                <input id="quantity" type="number" value="1" min="1" data-testid="product-quantity">
            </div>

            <div class="product-detail-actions">
                <button id="product-add-to-cart" type="button" data-testid="add-to-cart">
                    Add to Cart
                </button>

                <a href="cart.html" data-testid="view-cart">
                    View Cart
                </a>
            </div>
        </div>
    </section>

    <section class="product-description-section">
        <h2>Product Information</h2>
        <p id="product-information" data-testid="product-information"></p>
    </section>
</main>


    <footer>

        <p>&copy; 2026 DeMart. All rights reserved.</p>

    </footer>


    <script src="../js/app.js"></script>

</body>

</html>
