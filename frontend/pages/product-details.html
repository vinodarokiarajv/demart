<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - DeMart</title>

    <link rel="icon" type="image/png" href="../assets/icons/demart-icon.png">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="site-header">

        <h1 class="brand">DeMart</h1>

        <nav class="main-nav">
            <a href="../index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="cart.html">Cart</a>
        </nav>

    </header>


    <main>
    <div id="product-error" class="product-error" hidden>
        <h2>Product Not Found</h2>
        <p>
            The product you're looking for doesn't exist or is no longer available.
        </p>
        <a href="products.html">Back to Products</a>
    </div>
    <section class="product-details">
        <div class="product-details-image">
            <img id="product-image" src="" alt="">
        </div>

        <div class="product-details-info">
            <p id="product-category" class="product-category"></p>

            <h2 id="product-name"></h2>

            <p id="product-rating" class="product-rating"></p>

            <p id="product-price" class="product-price"></p>

            <p id="product-description" class="product-description"></p>

            <div class="product-quantity">
                <label for="quantity">Quantity</label>
                <input id="quantity" type="number" value="1" min="1">
            </div>

            <div class="product-detail-actions">
                <button type="button">
                    Add to Cart
                </button>

                <a href="cart.html">
                    View Cart
                </a>
            </div>
        </div>
    </section>

    <section class="product-description-section">
        <h2>Product Information</h2>
        <p id="product-information"></p>
    </section>
</main>


    <footer>

        <p>&copy; 2026 DeMart. All rights reserved.</p>

    </footer>


    <script src="../js/app.js"></script>

</body>

</html>
