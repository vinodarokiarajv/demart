<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - DeMart</title>

    <link rel="icon" type="image/png" href="../assets/icons/demart-icon.png">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="site-header">

        <h1 class="brand">DeMart</h1>

        <nav class="main-nav">
    <a href="../index.html">Home</a>
    <a href="products.html">Products</a>

    <a href="login.html" id="login-link">Login</a>
    <a href="register.html" id="register-link">Register</a>

    <a href="cart.html">Cart</a>

    <a href="account.html" id="account-link" style="display: none;">
        Account
    </a>

    <a href="#" id="logout-link" style="display: none;">
        Logout
    </a>
</nav>

    </header>


    <main>

        <section class="auth-page">

            <div class="auth-card">

                <h2>Welcome Back</h2>

                <p class="auth-subtitle">
                    Sign in to your DeMart account
                </p>


                <form id="login-form" class="auth-form">

                    <div class="form-group">

                        <label for="login-email">
                            Email Address
                        </label>

                        <input
                            id="login-email"
                            type="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="login-password">
                            Password
                        </label>

                        <input
                            id="login-password"
                            type="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <div class="auth-options">

                        <label class="remember-me">

                            <input
                                type="checkbox"
                                id="remember-me"
                            >

                            <span>Remember me</span>

                        </label>

                        <a href="#" class="forgot-password">
                            Forgot password?
                        </a>

                    </div>


                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Login
                    </button>

                </form>

                <p id="login-message"></p>

                <div class="auth-divider">
                    <span>OR</span>
                </div>


                <p class="auth-register">

                    Don't have an account?

                    <a href="register.html">
                        Create an account
                    </a>

                </p>


                <a
                    href="products.html"
                    class="guest-link"
                >
                    Continue shopping as guest
                </a>

            </div>

        </section>

    </main>


    <footer>

        <p>&copy; 2026 DeMart. All rights reserved.</p>

    </footer>


    <script src="../js/app.js"></script>

</body>

</html>
