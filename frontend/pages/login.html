<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - DeMart</title>

    <link rel="icon" type="image/png" href="../assets/icons/demart-icon.png">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

        <header class="site-header">

        <a href="home.html" class="brand-link">
            <span class="brand">DeMart</span>
        </a>

        <nav class="main-nav">

            <a href="home.html">Home</a>

            <a href="products.html">Products</a>

            <a href="login.html" id="login-link">Login</a>

            <a href="register.html" id="register-link">Register</a>

            <a href="account.html" id="account-link">Account</a>

            <a href="orders.html" id="orders-link">My Orders</a>

            <a href="cart.html">Cart</a>

            <a href="admin-users.html" id="admin-users-link">Manage Users</a>

            <a href="admin-orders.html" id="admin-orders-link">Manage Orders</a>

            <a href="#" id="logout-link">Logout</a>

        </nav>

    </header>


    <main>

        <section class="auth-page">

            <div class="auth-card">

                <h2>Welcome Back</h2>

                <p class="auth-subtitle">
                    Sign in to your DeMart account
                </p>


                <form id="login-form" class="auth-form">

                    <div class="form-group">

                        <label for="login-email">
                            Email Address
                        </label>

                        <input
                            id="login-email"
                            type="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">
    <label for="login-password">
        Password
    </label>

    <div class="password-input-wrapper">
        <input
            id="login-password"
            type="password"
            placeholder="Enter your password"
            required
        >
        <button
    type="button"
    class="password-toggle"
    id="login-password-toggle"
    aria-label="Show password"
    aria-pressed="false"
>
    <svg
        class="password-toggle-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
    >
        <path
            d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
        ></path>
        <circle cx="12" cy="12" r="2.5"></circle>
    </svg>
</button>
    </div>
</div>


                    <div class="auth-options">

                        <label class="remember-me">

                            <input
                                type="checkbox"
                                id="remember-me"
                            >

                            <span>Remember me</span>

                        </label>

                        <a href="#" class="forgot-password">
                            Forgot password?
                        </a>

                    </div>


                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Login
                    </button>

                </form>

                <p id="login-message"></p>

                <div class="auth-divider">
                    <span>OR</span>
                </div>


                <p class="auth-register">

                    Don't have an account?

                    <a href="register.html">
                        Create an account
                    </a>

                </p>


                <a
                    href="products.html"
                    class="guest-link"
                >
                    Continue shopping as guest
                </a>

            </div>

        </section>

    </main>


    <footer>

        <p>&copy; 2026 DeMart. All rights reserved.</p>

    </footer>


    <script src="../js/app.js"></script>

</body>

</html>
