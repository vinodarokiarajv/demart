<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Account - DeMart</title>

    <link rel="icon" type="image/png" href="../assets/icons/demart-icon.png">

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <header class="site-header">

        <h1 class="brand">DeMart</h1>

        <nav class="main-nav">
            <a href="../index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="login.html" id="login-link">Login</a>
            <a href="register.html" id="register-link">Register</a>
            <a href="account.html" id="account-link">Account</a>
            <a href="#" id="logout-link">Logout</a>
            <a href="cart.html">Cart</a>
        </nav>

    </header>

    <main class="account-container">

        <h1>My Account</h1>

        <section class="account-card">

            <h2>Personal Information</h2>

            <div class="account-info">

                <p>
                    <strong>Name:</strong>
                    <span id="account-name"></span>
                </p>

                <p>
                    <strong>Email:</strong>
                    <span id="account-email"></span>
                </p>

                <p>
                    <strong>Member Since:</strong>
                    <span id="account-created"></span>
                </p>

            </div>

        </section>

        <section class="account-card">

            <h2>Orders</h2>

            <p>View your previous orders.</p>

            <a href="orders.html" class="account-button">
                View My Orders
            </a>

        </section>

    </main>

    <script src="../js/app.js"></script>

</body>

</html>
