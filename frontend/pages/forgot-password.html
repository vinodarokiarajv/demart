<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DeMart — Forgot Password</title>

    <link
        rel="icon"
        type="image/png"
        href="../assets/icons/demart-icon.png"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body>

    <header class="site-header">
        <nav class="navbar">
            <a
                href="../index.html"
                class="site-brand"
                data-testid="site-brand"
            >
                DeMart
            </a>

            <div class="nav-links">
                <a
                    href="../index.html"
                    data-testid="home-link"
                >
                    Home
                </a>

                <a
                    href="products.html"
                    data-testid="products-link"
                >
                    Products
                </a>

                <a
                    href="login.html"
                    data-testid="login-link"
                >
                    Login
                </a>

                <a
                    href="register.html"
                    data-testid="register-link"
                >
                    Register
                </a>
            </div>
        </nav>
    </header>

    <main class="auth-container">

        <section class="auth-card">

            <h1>Forgot Password</h1>

            <p>
                Enter your email address and we'll help you reset
                your password.
            </p>

            <form
                id="forgot-password-form"
                class="auth-form"
            >

                <div class="form-group">

                    <label for="forgot-password-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="forgot-password-email"
                        data-testid="forgot-password-email"
                        autocomplete="email"
                        required
                    >

                </div>

                <button
                    type="submit"
                    id="forgot-password-submit"
                    data-testid="forgot-password-submit"
                >
                    Send Reset Link
                </button>

                <p
                    id="forgot-password-message"
                    data-testid="forgot-password-message"
                    class="form-message"
                    aria-live="polite"
                ></p>

            </form>

            <p>
                <a
                    href="login.html"
                    id="forgot-password-back-to-login"
                    data-testid="forgot-password-back-to-login"
                >
                    Back to Login
                </a>
            </p>

        </section>

    </main>

    <script src="../js/app.js"></script>

</body>

</html>
