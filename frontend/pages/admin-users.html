<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Manage Users - DeMart</title>

<link
    rel="icon"
    type="image/png"
    href="../assets/icons/demart-icon.png"
>

<link
    rel="stylesheet"
    href="../css/style.css"
>

</head>

<body>

    <header class="site-header" data-testid="site-header">

    <a href="home.html" class="brand-link" data-testid="site-brand">
        <span class="brand">DeMart</span>
    </a>

    <nav class="main-nav">
        <a href="home.html" data-testid="home-link">Home</a>
        <a href="products.html" data-testid="products-link">Products</a>
        <a href="login.html" id="login-link" data-testid="login-link">Login</a>
        <a href="register.html" id="register-link" data-testid="register-link">Register</a>
        <a href="account.html" id="account-link" data-testid="account-link">Account</a>
        <a href="orders.html" id="orders-link" data-testid="orders-link">My Orders</a>
        <a href="cart.html" data-testid="cart-link">
            Cart (<span id="cart-count" data-testid="cart-count">0</span>)
        </a>
        <a href="admin-users.html" id="admin-users-link" data-testid="admin-users-link">Manage Users</a>
        <a href="admin-orders.html" id="admin-orders-link" data-testid="admin-orders-link">Manage Orders</a>
        <a href="#" id="logout-link" data-testid="logout-link">Logout</a>
    </nav>

    </header>


    <main data-testid="admin-users-page">
        <section class="admin-users-page">

        <div class="admin-users-header" data-testid="admin-users-header">

            <div>

                <p class="admin-eyebrow">
                    ADMINISTRATION
                </p>

                <h2 data-testid="admin-users-title">
                    Manage Users
                </h2>

                <p>
                    Manage user access and account roles across DeMart.
                </p>

            </div>

            <div class="admin-users-summary">

                <span class="admin-summary-label">
                    ACCESS LEVEL
                </span>

                <strong>
                    ADMIN
                </strong>

            </div>

        </div>

        <div
            id="admin-users-message"
            class="account-message"
            data-testid="admin-users-message"
            hidden
        ></div>

        <div class="admin-users-container">

            <div class="admin-users-table-wrapper">

                <table class="admin-users-table" data-testid="admin-users-table">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>User</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody
                        id="admin-users-table-body"
                        data-testid="admin-users-table-body">
                    </tbody>

                </table>

            </div>

        </div>

    </section>

</main>


<footer>

    <p>
        &copy; 2026 DeMart. All rights reserved.
    </p>

</footer>


<script src="../js/app.js"></script>
<script src="../js/admin-users.js"></script>

</body>

</html>
