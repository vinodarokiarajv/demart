<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products - DeMart</title>

    <link rel="icon" type="image/png" href="../assets/icons/demart-icon.png">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

        <header class="site-header">

        <a href="home.html" class="brand-link">
            <span class="brand">DeMart</span>
        </a>

        <nav class="main-nav">

            <a href="home.html" data-testid="home-link">Home</a>

            <a href="products.html" data-testid="products-link">Products</a>

            <a href="login.html" id="login-link" data-testid="login-link">Login</a>

            <a href="register.html" id="register-link" data-testid="register-link">Register</a>

            <a href="account.html" id="account-link" data-testid="account-link">Account</a>

            <a href="orders.html" id="orders-link" data-testid="orders-link">My Orders</a>

            <a href="cart.html" data-testid="cart-link">
                Cart (<span id="cart-count" data-testid="cart-count">0</span>)
            </a>

            <a href="admin-users.html" id="admin-users-link" data-testid="admin-users-link">
                Manage Users
            </a>

            <a href="admin-orders.html" id="admin-orders-link" data-testid="admin-orders-link">
                Manage Orders
            </a>

            <a href="#" id="logout-link" data-testid="logout-link">Logout</a>

        </nav>

    </header>


    <main>

        <section class="products-page">

            <h2>Products</h2>

            <div class="product-controls">

    <div class="product-search-wrapper">

        <input
            id="product-search"
            type="search"
            placeholder="Search products..."
            aria-label="Search products"
            autocomplete="off"
            data-testid="product-search"
        >

        <div
            class="product-suggestions"
            aria-label="Product suggestions"
            data-testid="product-suggestions"
        ></div>

    </div>

    <select
        id="product-category-filter"
        aria-label="Filter by category"
        data-testid="product-category-filter"
    >
    <option value="">All Categories</option>
    <option value="Laptops">Laptops</option>
    <option value="Audio">Audio</option>
    <option value="Accessories">Accessories</option>
    <option value="Smartphones">Smartphones</option>
    <option value="Monitors">Monitors</option>
</select>

                <select
                    id="product-sort"
                    aria-label="Sort products"
                    data-testid="product-sort"
                >
                    <option value="">Sort By</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                    <option value="name">Name</option>
                </select>

            </div>


            <div
                class="product-container"
                data-testid="product-container"
            >
            </div>

        </section>

    </main>


    <footer>

        <p>&copy; 2026 DeMart. All rights reserved.</p>

    </footer>


    <script src="../js/app.js"></script>

</body>

</html>
