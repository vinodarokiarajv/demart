<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - DeMart</title>

    <link rel="icon" type="image/png" href="../assets/icons/demart-icon.png">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="site-header">

        <h1 class="brand">DeMart</h1>

        <nav class="main-nav">
    <a href="../index.html">Home</a>
    <a href="products.html">Products</a>

    <a href="login.html" id="login-link">Login</a>
    <a href="register.html" id="register-link">Register</a>

    <a href="cart.html">Cart</a>

    <a href="account.html" id="account-link" style="display: none;">
        Account
    </a>

    <a href="#" id="logout-link" style="display: none;">
        Logout
    </a>
</nav>

    </header>


    <main>

        <section class="auth-page">

            <div class="auth-card">

                <h2>Create Account</h2>

                <p class="auth-subtitle">
                    Join DeMart and start shopping
                </p>


                <form id="register-form" class="auth-form">

    <div class="form-group">
        <label for="register-first-name">
            First Name
        </label>
        <input
            id="register-first-name"
            type="text"
            placeholder="Enter your first name"
            required
        >
    </div>

    <div class="form-group">
        <label for="register-last-name">
            Last Name
        </label>
        <input
            id="register-last-name"
            type="text"
            placeholder="Enter your last name"
            required
        >
    </div>

    <div class="form-group">
        <label for="register-email">
            Email Address
        </label>
        <input
            id="register-email"
            type="email"
            placeholder="you@example.com"
            required
        >
    </div>

    <div class="form-group">
        <label for="register-password">
            Password
        </label>
        <input
            id="register-password"
            type="password"
            placeholder="Enter your password"
            required
        >
    </div>

    <div class="form-group">
        <label for="confirm-password">
            Confirm Password
        </label>
        <input
            id="confirm-password"
            type="password"
            placeholder="Confirm your password"
            required
        >
    </div>

    <div class="form-group">
        <label for="register-street">
            Street Address
        </label>
        <input
            id="register-street"
            type="text"
            placeholder="Enter your street address"
            required
        >
    </div>

    <div class="form-group">
        <label for="register-postal-code">
            Postal Code
        </label>
        <input
            id="register-postal-code"
            type="text"
            placeholder="Enter your postal code"
            required
        >
    </div>

    <div class="form-group">
        <label for="register-city">
            City
        </label>
        <input
            id="register-city"
            type="text"
            placeholder="Enter your city"
            required
        >
    </div>

    <div class="form-group">
        <label for="register-country">
            Country
        </label>
        <input
            id="register-country"
            type="text"
            placeholder="Enter your country"
            required
        >
    </div>

    <button type="submit" class="auth-button">
        Register
    </button>

    <p id="register-message" class="form-message"></p>

</form>

                <div class="auth-divider">
                    <span>OR</span>
                </div>


                <p class="auth-register">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>


                <a
                    href="products.html"
                    class="guest-link"
                >
                    Continue shopping as guest
                </a>

            </div>

        </section>

    </main>


    <footer>

        <p>&copy; 2026 DeMart. All rights reserved.</p>

    </footer>


    <script src="../js/app.js"></script>

</body>

</html>
