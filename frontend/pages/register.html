<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DeMart — Create Account</title>

    <link rel="icon" type="image/png" href="../assets/icons/demart-icon.png">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

        <header class="site-header">

        <a href="home.html" class="brand-link">
            <span class="brand">DeMart</span>
        </a>

        <nav class="main-nav">

            <a href="home.html">Home</a>

            <a href="products.html">Products</a>

            <a
                href="login.html"
                id="sign-in-link"
                data-testid="sign-in-link"
            >
                Sign In
            </a>

            <a href="register.html" id="register-link">Register</a>

            <a href="account.html" id="account-link">Account</a>

            <a href="orders.html" id="orders-link">My Orders</a>

            <a href="cart.html">Cart</a>

            <a href="admin-users.html" id="admin-users-link">Manage Users</a>

            <a href="admin-orders.html" id="admin-orders-link">Manage Orders</a>

            <a href="#" id="logout-link">Logout</a>

        </nav>

    </header>


    <main>

        <section class="auth-page">

            <div class="auth-card">

                <h2>Create Account</h2>

                <p class="auth-subtitle">
                    Join DeMart and start shopping
                </p>


                <form
                    id="register-form"
                    class="auth-form"
                    data-testid="register-form"
                >

    <div class="form-group">
        <label for="register-first-name">
            First Name
        </label>
        <input
            id="register-first-name"
            name="firstName"
            data-testid="register-first-name"
            type="text"
            placeholder="Enter your first name"
            autocomplete="given-name"
            required
        >
    </div>

    <div class="form-group">
        <label for="register-last-name">
            Last Name
        </label>
        <input
            id="register-last-name"
            name="lastName"
            data-testid="register-last-name"
            type="text"
            placeholder="Enter your last name"
            autocomplete="surname"
            required
        >
    </div>

    <div class="form-group">
        <label for="register-email">
            Email Address
        </label>
        <input
            id="register-email"
            name="email"
            data-testid="register-email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
        >
    </div>

    <div class="form-group">
        <label for="register-password">
            Password
        </label>
        <input
            id="register-password"
            name="password"
            data-testid="register-password"
            type="password"
            placeholder="Enter your password"
            autocomplete="new-password"
            required
        >
    </div>

    <div class="form-group">
        <label for="register-confirm-password">
            Confirm Password
        </label>
        <input
            id="register-confirm-password"
            name="confirmPassword"
            data-testid="register-confirm-password"
            type="password"
            placeholder="Confirm your password"
            autocomplete="new-password"
            required
        >
    </div>

    <div class="form-group">
        <label for="register-street">
            Street Address
        </label>
        <input
            id="register-street"
            name="street"
            data-testid="register-street"
            type="text"
            placeholder="Enter your street address"
            autocomplete="street-address"
            required
        >
    </div>

    <div class="form-group">
        <label for="register-postal-code">
            Postal Code
        </label>
        <input
            id="register-postal-code"
            name="postalCode"
            data-testid="register-postal-code"
            type="text"
            placeholder="Enter your postal code"
            autocomplete="postal-code"
            required
        >
    </div>

    <div class="form-group">
        <label for="register-city">
            City
        </label>
        <input
            id="register-city"
            name="city"
            data-testid="register-city"
            type="text"
            placeholder="Enter your city"
            autocomplete="address-level2"
            required
        >
    </div>

    <div class="form-group">
        <label for="register-country">
            Country
        </label>
        <input
            id="register-country"
            name="country"
            data-testid="register-country"
            autocomplete="country-name"
            type="text"
            placeholder="Enter your country"
            required
        >
    </div>

    <div class="terms-agreement">

        <label>
            <input
                type="checkbox"
                id="register-terms"
                name="terms"
                data-testid="register-terms"
                required
            >

            <span>
                I agree to the
                <a
                    href="terms.html"
                    target="_blank"
                    rel="noopener"
                    id="terms-link"
                    data-testid="terms-link"
                >
                    Terms &amp; Conditions
                </a>
            </span>
        </label>

    </div>

    <button
        type="submit"
        class="auth-button"
        id="register-submit"
        data-testid="register-submit"
    >
        Create Account
    </button>

    <p
        id="register-message"
        class="form-message"
        data-testid="register-message"
        role="status"
        aria-live="polite"
    ></p>

</form>

                <div class="auth-divider">
                    <span>OR</span>
                </div>


                <p class="auth-register">

                    Already have an account?

                    <a
                        href="login.html"
                        id="auth-sign-in-link"
                        data-testid="auth-sign-in-link"
                    >
                        Sign In
                    </a>

                </p>


                <a
                    href="products.html"
                    class="guest-link"
                    id="continue-as-guest"
                    data-testid="continue-as-guest"
                >
                    Continue shopping as guest
                </a>

            </div>

        </section>

    </main>


    <footer>

        <p>&copy; 2026 DeMart. All rights reserved.</p>

    </footer>


    <script src="../js/app.js"></script>

</body>

</html>
