<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DeMart — Reset Password</title>

    <link
        rel="icon"
        type="image/png"
        href="../assets/icons/demart-icon.png"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body>

    <header class="site-header">
        <nav class="navbar">

            <a
                href="../index.html"
                class="site-brand"
                data-testid="site-brand"
            >
                DeMart
            </a>

            <div class="nav-links">

                <a
                    href="../index.html"
                    data-testid="home-link"
                >
                    Home
                </a>

                <a
                    href="products.html"
                    data-testid="products-link"
                >
                    Products
                </a>

                <a
                    href="login.html"
                    data-testid="login-link"
                >
                    Login
                </a>

                <a
                    href="register.html"
                    data-testid="register-link"
                >
                    Register
                </a>

            </div>

        </nav>
    </header>

    <main class="auth-container">

        <section class="auth-card">

            <h1>Reset Password</h1>

            <p>
                Enter your new password below.
            </p>

            <form
                id="reset-password-form"
                class="auth-form"
            >

                <div class="form-group">

                    <label for="reset-password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="reset-password"
                        data-testid="reset-password"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="reset-confirm-password">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="reset-confirm-password"
                        data-testid="reset-confirm-password"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    id="reset-password-submit"
                    data-testid="reset-password-submit"
                >
                    Reset Password
                </button>

                <p
                    id="reset-password-message"
                    data-testid="reset-password-message"
                    class="form-message"
                    aria-live="polite"
                ></p>

            </form>

            <p>
                <a
                    href="login.html"
                    id="reset-password-back-to-login"
                    data-testid="reset-password-back-to-login"
                >
                    Back to Login
                </a>
            </p>

        </section>

    </main>

    <script src="../js/app.js"></script>

</body>

</html>
