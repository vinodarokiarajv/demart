<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - DeMart</title>

    <link rel="icon" type="image/png" href="../assets/icons/demart-icon.png">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="site-header">

        <h1 class="brand">DeMart</h1>

        <nav class="main-nav">
            <a href="../index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="cart.html">Cart</a>
        </nav>

    </header>


    <main>

        <section class="cart-page">
    <h2>Shopping Cart</h2>

    <div class="cart-container">

        <div class="cart-items" id="cart-items">
            <!-- Cart items will be loaded dynamically -->
        </div>

        <aside class="cart-summary">
            <h3>Order Summary</h3>

            <div class="summary-row">
                <span>Subtotal</span>
                <span id="cart-subtotal">€0.00</span>
            </div>

            <div class="summary-row">
                <span>Shipping</span>
                <span id="cart-shipping">€0.00</span>
            </div>

            <div class="summary-row">
                <span>Total</span>
                <strong id="cart-total">€0.00</strong>
            </div>

            <a href="checkout.html" class="checkout-button">
                Proceed to Checkout
            </a>
        </aside>

    </div>
</section>

    </main>


    <footer>

        <p>&copy; 2026 DeMart. All rights reserved.</p>

    </footer>


    <script src="../js/app.js"></script>

</body>

</html>
