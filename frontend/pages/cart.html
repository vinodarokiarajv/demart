<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - DeMart</title>

    <link rel="icon" type="image/png" href="../assets/icons/demart-icon.png">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="site-header">

        <h1 class="brand">DeMart</h1>

        <nav class="main-nav">
            <a href="../index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="cart.html">Cart</a>
        </nav>

    </header>


    <main>

        <section class="cart-page">

            <h2>Shopping Cart</h2>


            <div class="cart-container">

                <div class="cart-items">

                    <article class="cart-item">

                        <div class="cart-item-image">
                            <span>Image</span>
                        </div>

                        <div class="cart-item-info">

                            <p class="product-category">
                                Electronics
                            </p>

                            <h3>Wireless Headphones</h3>

                            <p class="cart-item-price">
                                €79.99
                            </p>

                        </div>

                        <div class="cart-item-quantity">

                            <label for="quantity-headphones">
                                Quantity
                            </label>

                            <input
                                id="quantity-headphones"
                                type="number"
                                value="1"
                                min="1"
                            >

                        </div>

                        <div class="cart-item-total">

                            <p>€79.99</p>

                            <button type="button">
                                Remove
                            </button>

                        </div>

                    </article>


                    <article class="cart-item">

                        <div class="cart-item-image">
                            <span>Image</span>
                        </div>

                        <div class="cart-item-info">

                            <p class="product-category">
                                Fashion
                            </p>

                            <h3>Classic Sneakers</h3>

                            <p class="cart-item-price">
                                €64.99
                            </p>

                        </div>

                        <div class="cart-item-quantity">

                            <label for="quantity-sneakers">
                                Quantity
                            </label>

                            <input
                                id="quantity-sneakers"
                                type="number"
                                value="1"
                                min="1"
                            >

                        </div>

                        <div class="cart-item-total">

                            <p>€64.99</p>

                            <button type="button">
                                Remove
                            </button>

                        </div>

                    </article>

                </div>


                <aside class="cart-summary">

                    <h3>Order Summary</h3>

                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span>€144.98</span>
                    </div>

                    <div class="summary-row">
                        <span>Shipping</span>
                        <span>€4.99</span>
                    </div>

                    <div class="summary-row">
                        <span>Total</span>
                        <strong>€149.97</strong>
                    </div>

                    <a href="checkout.html" class="checkout-button">
                        Proceed to Checkout
                    </a>

                </aside>

            </div>

        </section>

    </main>


    <footer>

        <p>&copy; 2026 DeMart. All rights reserved.</p>

    </footer>


    <script src="../js/app.js"></script>

</body>

</html>
