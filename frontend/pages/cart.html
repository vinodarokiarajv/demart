<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - DeMart</title>

    <link rel="icon" type="image/png" href="../assets/icons/demart-icon.png">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

        <header class="site-header">

        <a href="home.html" class="brand-link" data-testid="site-brand">
            <span class="brand">DeMart</span>
        </a>

        <nav class="main-nav">

            <a href="home.html" data-testid="home-link">Home</a>
            <a href="products.html" data-testid="products-link">Products</a>
            <a href="login.html" id="login-link" data-testid="login-link">Login</a>
            <a href="register.html" id="register-link" data-testid="register-link">Register</a>
            <a href="account.html" id="account-link" data-testid="account-link">Account</a>
            <a href="orders.html" id="orders-link" data-testid="orders-link">My Orders</a>
            <a href="cart.html" data-testid="cart-link">
                Cart (<span id="cart-count" data-testid="cart-count">0</span>)
            </a>
            <a href="admin-users.html" id="admin-users-link" data-testid="admin-users-link">Manage Users</a>
            <a href="admin-orders.html" id="admin-orders-link" data-testid="admin-orders-link">Manage Orders</a>
            <a href="#" id="logout-link" data-testid="logout-link">Logout</a>

        </nav>

    </header>


    <main>

        <section class="cart-page">
    <h2>Shopping Cart</h2>

    <div class="cart-container">

        <div class="cart-items" id="cart-items" data-testid="cart-items">
            <!-- Cart items will be loaded dynamically -->
        </div>

        <aside class="cart-summary">
            <h3>Order Summary</h3>

            <div class="summary-row">
                <span>Subtotal</span>
                <span id="cart-subtotal" data-testid="cart-subtotal">€0.00</span>
            </div>

            <div class="summary-row">
                <span>Shipping</span>
                <span id="cart-shipping" data-testid="cart-shipping">€0.00</span>
            </div>

            <div class="summary-row">
                <span>Total</span>
                <strong id="cart-total" data-testid="cart-total">€0.00</strong>
            </div>

            <a
                href="checkout.html"
                class="checkout-button"
                id="proceed-to-checkout"
                data-testid="proceed-to-checkout"
                aria-disabled="true"
            >
                Proceed to Checkout
            </a>
        </aside>

    </div>
</section>

    </main>


    <footer>

        <p>&copy; 2026 DeMart. All rights reserved.</p>

    </footer>


    <script src="../js/app.js"></script>

</body>

</html>
