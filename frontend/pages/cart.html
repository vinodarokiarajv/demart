<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - DeMart</title>

    <link rel="icon" type="image/png" href="../assets/icons/demart-icon.png">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

        <header class="site-header">

        <a href="home.html" class="brand-link">
            <span class="brand">DeMart</span>
        </a>

        <nav class="main-nav">

            <a href="home.html">Home</a>

            <a href="products.html">Products</a>

            <a href="login.html" id="login-link">Login</a>

            <a href="register.html" id="register-link">Register</a>

            <a href="account.html" id="account-link">Account</a>

            <a href="orders.html" id="orders-link">My Orders</a>

            <a href="cart.html">Cart</a>

            <a href="admin-users.html" id="admin-users-link">Manage Users</a>

            <a href="admin-orders.html" id="admin-orders-link">Manage Orders</a>

            <a href="#" id="logout-link">Logout</a>

        </nav>

    </header>


    <main>

        <section class="cart-page">
    <h2>Shopping Cart</h2>

    <div class="cart-container">

        <div class="cart-items" id="cart-items">
            <!-- Cart items will be loaded dynamically -->
        </div>

        <aside class="cart-summary">
            <h3>Order Summary</h3>

            <div class="summary-row">
                <span>Subtotal</span>
                <span id="cart-subtotal">€0.00</span>
            </div>

            <div class="summary-row">
                <span>Shipping</span>
                <span id="cart-shipping">€0.00</span>
            </div>

            <div class="summary-row">
                <span>Total</span>
                <strong id="cart-total">€0.00</strong>
            </div>

            <a href="checkout.html" class="checkout-button">
                Proceed to Checkout
            </a>
        </aside>

    </div>
</section>

    </main>


    <footer>

        <p>&copy; 2026 DeMart. All rights reserved.</p>

    </footer>


    <script src="../js/app.js"></script>

</body>

</html>
